name: Vérifications

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests et compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: php -l api/router.php
      - run: php -l api/index.php
      - run: php -l deploy/avis-communaute.config.php.example
      - run: npm test
      - run: npm run build:hostinger
      - name: Préparer l’archive pour le transfert manuel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-hostinger
          path: hostinger-site/
          if-no-files-found: error
          retention-days: 14
